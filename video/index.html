<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Видео Че: книжный клуб ЧЕ">
<meta property="og:description" content="Видео-приветствие Че с музыкой">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui;background:#f7f7f5}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Видео Че: книжный клуб ЧЕ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@700&display=swap">
<style>
/* Видео-приветствие Че (QR с плакатов). Ролик: mockups/che-video/build.py + render.mjs; звук tools/che-voice/music.py */
:root{--paper:#ffe600;--ink:#111;--red:#c8211b;--f-d:Oswald,'Arial Narrow',system-ui,sans-serif;--f-b:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;--fs-s:16px;--fs-m:18px;--fs-l:22px;--fs-h1:36px;--fs-h1-d:56px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--fs-m)/1.5 var(--f-b)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
h1{margin:0;font:700 var(--fs-h1)/1.05 var(--f-d);text-transform:uppercase}
.lead{margin:0;font-size:var(--fs-m)}
video{display:block;width:100%;height:auto;aspect-ratio:1/1;border:4px solid var(--ink);border-radius:16px;background:var(--ink)}
.cta{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:var(--red);color:#fff;border:3px solid var(--ink);font:700 var(--fs-l)/1 var(--f-d);text-transform:uppercase;text-decoration:none}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.note{margin:0;font-size:var(--fs-s)}
.side{display:grid;gap:16px;align-content:start}
@media (min-width:900px){.wrap{max-width:1400px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:24px 40px;align-items:start;padding-block:40px}
  .wrap>video{grid-row:1/span 2;grid-column:1}h1{font-size:var(--fs-h1-d)}.lead,.note{font-size:var(--fs-l)}}
</style>
</head>
<body>
<main class="wrap">
  <div class="side">
  <h1>Привет от Че</h1>
  <p class="lead">Включи звук: Че споёт, расскажет про книжный клуб и позовёт тебя вступить.</p>
  </div>
  <video src="che-privet.mp4" poster="poster.jpg" controls playsinline preload="metadata" width="1080" height="1080"></video>
  <div class="side">
  <a class="cta" href="../app/?brand=che&amp;mode=member&amp;tab=join">Вступить в клуб</a>
  <p class="note">За вступление подарок: леденец Dulce Victoria, «сладкая победа».</p>
  </div>
</main>

</body>
</html>
